# Publishes the package to PyPI and then registers it with the official MCP
# Registry (https://registry.modelcontextprotocol.io).
#
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
#
# Requires one repository secret: PYPI_API_TOKEN (from https://pypi.org/manage/account/token/).
# The registry step needs no secret — it authenticates with GitHub OIDC, which
# grants the `io.github.shubham303/*` namespace automatically.
name: Publish to PyPI and the MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC auth against the registry
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --extra dev pytest -q

      # --- PyPI -------------------------------------------------------------
      # The registry verifies ownership by finding the `mcp-name:` marker at the
      # top of README.md, which setuptools publishes as the PyPI description.

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token "${{ secrets.PYPI_API_TOKEN }}"

      # --- MCP Registry -----------------------------------------------------

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
